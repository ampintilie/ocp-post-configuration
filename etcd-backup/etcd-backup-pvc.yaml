---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: no-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: "0"
provisioner: kubernetes.io/no-provisioner
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-etcd-backup-pv
  namespace: "etcd-backup"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  storageClassName: no-provisioner
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /srv/nfs/share
    server: 192.168.28.11
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-etcd-backup-pvc
  namespace: "etcd-backup"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  storageClassName: no-provisioner
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: nfs-etcd-backup-pv
