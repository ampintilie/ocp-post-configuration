kind: CronJob
apiVersion: batch/v1
metadata:
  name: cronjob-etcd-backup
  namespace: "etcd-backup"
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  schedule: "0 1 * * *" # At 01:00 every day # TODO Change to your desired schedule
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      name: etcd-backup
    spec:
      template:
        metadata:
          name: etcd-backup
        spec:
          serviceAccount: "etcd-backup-sa"
          volumes:
            - name: host
              hostPath:
                path: /
                type: ''
            - name: script
              configMap:
                name: backup-configmap
                defaultMode: 0550
            - name: nfs-share
              persistentVolumeClaim:
                claimName: nfs-etcd-backup-pvc
          containers:
            - name: ocp-cli
              image: registry.redhat.io/openshift4/ose-cli
              command:
                - /bin/sh
              args:
                - /opt/backup/backup.sh
              ports:
                - containerPort: 8080
                  protocol: TCP
              resources: {}
              volumeMounts:
                - name: host
                  mountPath: /host
                - name: script
                  mountPath: /opt/backup
                - name: nfs-share
                  mountPath: /mnt/nfs-share
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              imagePullPolicy: IfNotPresent
              securityContext:
                privileged: true
                runAsUser: 0
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          dnsPolicy: ClusterFirst
          nodeSelector:
            node-role.kubernetes.io/control-plane: ''
          hostNetwork: true
          schedulerName: default-scheduler
          tolerations:
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
